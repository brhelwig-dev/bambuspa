name: screenshots

on:
  pull_request:

# Each screen is captured from the pull request and from its base branch, and
# only the ones that look different are kept. Those are pushed to an orphan
# branch and shown, before and after, in one comment on the pull request.
# GitHub has no public way to attach an image to a comment, so the image has to
# be reachable by URL before it can be shown; the orphan branch keeps them out
# of the history of anything that ships.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    # A pull request from a fork gets a read-only token, so it could capture but
    # never comment. Skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is built too, to compare against.
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the browser
        working-directory: .github/screenshots
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # No printer here. The app serves the page regardless, and the status
          # endpoint is answered by the browser, so nothing depends on one.
          # No login either: the app refuses to start without being told one way
          # or the other, and there is no provider to point these at.
          serve() { # binary, port
            mkdir -p "/tmp/shot-data-$2"
            LISTEN_ADDR="127.0.0.1:$2" DATA_DIR="/tmp/shot-data-$2" AUTH_DISABLED=true "$1" &
            for i in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$2/healthz" >/dev/null && return 0
              sleep 1
            done
            curl -sf "http://127.0.0.1:$2/healthz"
          }

          build() { # source dir, output binary
            (cd "$1" && cargo build --locked --target-dir "$GITHUB_WORKSPACE/target" && cp "$GITHUB_WORKSPACE/target/debug/bambuspa" "$2")
          }

          build . /tmp/bambuspa
          serve /tmp/bambuspa 8081

          # The base branch is only something to compare against. If it cannot
          # be built or started, every shot is shown rather than none.
          git worktree add --detach /tmp/base "$BASE_SHA"
          if build /tmp/base /tmp/bambuspa-base &&
             serve /tmp/bambuspa-base 8082; then
            echo "BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::could not run the base branch; showing every screen"
          fi

      # Both captures use this branch's harness, so the states are staged the
      # same way and any difference is the page's own.
      - name: Capture
        working-directory: .github/screenshots
        run: |
          BASE=http://127.0.0.1:8081 OUT="$GITHUB_WORKSPACE/shots/head" node capture.mjs
          if [ "${BASELINE:-}" = true ]; then
            BASE=http://127.0.0.1:8082 OUT="$GITHUB_WORKSPACE/shots/base" node capture.mjs ||
              echo "::warning::could not capture the base branch; showing every screen"
          fi

      - name: Compare
        working-directory: .github/screenshots
        env:
          HEAD_DIR: ${{ github.workspace }}/shots/head
          BASE_DIR: ${{ github.workspace }}/shots/base
          OUT: ${{ github.workspace }}/shots/changed
        run: node compare.mjs

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: .github/screenshots/comment.sh
