name: screenshots

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the browser
        working-directory: .github/screenshots
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          serve() {
            mkdir -p "/tmp/shot-data-$2"
            LISTEN_ADDR="127.0.0.1:$2" DATA_DIR="/tmp/shot-data-$2" AUTH_DISABLED=true "$1" &
            for i in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$2/healthz" >/dev/null && return 0
              sleep 1
            done
            curl -sf "http://127.0.0.1:$2/healthz"
          }

          build() {
            if [ -f "$1/web/Cargo.toml" ]; then
              .github/scripts/build-web.sh "$1" || return 1
            fi
            (cd "$1" && cargo build --locked --target-dir "$GITHUB_WORKSPACE/target" && cp "$GITHUB_WORKSPACE/target/debug/bambuspa" "$2")
          }

          build . /tmp/bambuspa
          serve /tmp/bambuspa 8081

          git worktree add --detach /tmp/base "$BASE_SHA"
          if build /tmp/base /tmp/bambuspa-base &&
             serve /tmp/bambuspa-base 8082; then
            echo "BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::could not run the base branch; showing every screen"
          fi

      - name: Capture
        working-directory: .github/screenshots
        run: |
          BASE=http://127.0.0.1:8081 OUT="$GITHUB_WORKSPACE/shots/head" node capture.mjs
          if [ "${BASELINE:-}" = true ]; then
            BASE=http://127.0.0.1:8082 OUT="$GITHUB_WORKSPACE/shots/base" node capture.mjs ||
              echo "::warning::could not capture the base branch; showing every screen"
          fi

      - name: Compare
        working-directory: .github/screenshots
        env:
          HEAD_DIR: ${{ github.workspace }}/shots/head
          BASE_DIR: ${{ github.workspace }}/shots/base
          OUT: ${{ github.workspace }}/shots/changed
        run: node compare.mjs

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: .github/screenshots/comment.sh
