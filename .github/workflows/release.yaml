name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release

permissions:
  actions: read
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/brhelwig-dev/bambuspa
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Pick the next version and tag the commit
        id: next
        run: |
          if git tag --points-at "$SHA" | grep -q '^[0-9]'; then
            echo "$SHA is already released"
            exit 0
          fi
          now=$(date -u +'%y %-j %H %M')
          set -- $now
          tag="$1.$2.$((10#$3 * 60 + 10#$4))"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { platform: windows/amd64, runner: windows-latest }
          - { platform: windows/arm64, runner: windows-11-arm }
          - { platform: darwin/amd64, runner: macos-latest }
          - { platform: darwin/arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: matrix.platform == 'windows/arm64'
        run: |
          if ! command -v rustup; then
            curl -sSf -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none
            echo "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          fi
          if ! command -v clang; then
            choco install -y llvm
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: .github/scripts/build-dist.sh "$TAG" dist ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ strategy.job-index }}
          path: dist/*

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: .github/scripts/build-dist.sh checksums dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --verify-tag \
            --generate-notes

  image-tag:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the CI-built image with the release version
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ needs.tag.outputs.tag }}" \
            "$IMAGE:$SHA"
